<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Project Classifier - AI Mentor</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Header */
        header {
            background: rgba(0, 0, 0, 0.1);
            padding: 20px;
            text-align: center;
            color: white;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        header h1 {
            font-size: 2.5em;
            margin-bottom: 5px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
        }

        header p {
            font-size: 1em;
            opacity: 0.9;
        }

        /* Main Container */
        .container {
            display: flex;
            flex: 1;
            max-width: 1400px;
            margin: 20px auto;
            gap: 20px;
            width: 100%;
            padding: 0 20px;
        }

        /* Settings Panel */
        .settings-panel {
            width: 300px;
            background: white;
            border-radius: 15px;
            padding: 25px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            height: fit-content;
            position: sticky;
            top: 20px;
        }

        .settings-panel h3 {
            color: #667eea;
            margin-bottom: 15px;
            font-size: 1.3em;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 600;
            font-size: 0.9em;
        }

        .form-group input,
        .form-group textarea {
            width: 100%;
            padding: 10px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            font-size: 0.9em;
            transition: border-color 0.3s;
        }

        .form-group input:focus,
        .form-group textarea:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 10px rgba(102, 126, 234, 0.2);
        }

        .form-group textarea {
            resize: vertical;
            min-height: 80px;
        }

        .btn-group {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }

        button {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-size: 0.9em;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-analyze {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-analyze:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3);
        }

        .btn-analyze:active {
            transform: translateY(0);
        }

        .btn-clear {
            background: #f0f0f0;
            color: #667eea;
        }

        .btn-clear:hover {
            background: #e0e0e0;
        }

        /* Chat Container */
        .chat-container {
            flex: 1;
            background: white;
            border-radius: 15px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .chat-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            border-bottom: 3px solid rgba(0, 0, 0, 0.1);
        }

        .chat-header h2 {
            font-size: 1.5em;
            margin-bottom: 5px;
        }

        .chat-header p {
            font-size: 0.9em;
            opacity: 0.9;
        }

        /* Messages */
        .messages {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .message {
            display: flex;
            gap: 12px;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .message.user {
            justify-content: flex-end;
        }

        .message.assistant {
            justify-content: flex-start;
        }

        .message-avatar {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            color: white;
            flex-shrink: 0;
        }

        .message.user .message-avatar {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            order: 2;
        }

        .message.assistant .message-avatar {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
        }

        .message-content {
            max-width: 70%;
            padding: 12px 16px;
            border-radius: 12px;
            line-height: 1.5;
            word-wrap: break-word;
        }

        .message.user .message-content {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border-bottom-right-radius: 4px;
        }

        .message.assistant .message-content {
            background: #f0f0f0;
            color: #333;
            border-bottom-left-radius: 4px;
        }

        .message-content pre {
            background: #2d2d2d;
            color: #f8f8f2;
            padding: 12px;
            border-radius: 6px;
            overflow-x: auto;
            margin-top: 8px;
            font-size: 0.85em;
        }

        .message-content code {
            background: #f0f0f0;
            padding: 2px 6px;
            border-radius: 4px;
            font-family: 'Courier New', monospace;
        }

        .message.assistant .message-content code {
            background: #e0e0e0;
        }

        .loading {
            display: flex;
            gap: 6px;
            align-items: center;
        }

        .loading-dot {
            width: 8px;
            height: 8px;
            background: #667eea;
            border-radius: 50%;
            animation: bounce 1.4s infinite;
        }

        .loading-dot:nth-child(2) {
            animation-delay: 0.2s;
        }

        .loading-dot:nth-child(3) {
            animation-delay: 0.4s;
        }

        @keyframes bounce {
            0%, 60%, 100% {
                transform: translateY(0);
            }
            30% {
                transform: translateY(-10px);
            }
        }

        .empty-state {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            text-align: center;
            color: #999;
        }

        .empty-state-icon {
            font-size: 4em;
            margin-bottom: 15px;
            opacity: 0.5;
        }

        .empty-state h3 {
            color: #667eea;
            margin-bottom: 10px;
        }

        /* Input Area */
        .input-area {
            padding: 20px;
            background: #f9f9f9;
            border-top: 2px solid #f0f0f0;
        }

        .input-group {
            display: flex;
            gap: 10px;
        }

        .input-group input {
            flex: 1;
            padding: 12px 16px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 0.95em;
            transition: border-color 0.3s;
        }

        .input-group input:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 10px rgba(102, 126, 234, 0.2);
        }

        .input-group button {
            padding: 12px 24px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s;
        }

        .input-group button:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3);
        }

        .input-group button:active {
            transform: translateY(0);
        }

        /* Status Messages */
        .status-message {
            padding: 12px 16px;
            border-radius: 8px;
            margin-bottom: 10px;
            font-size: 0.9em;
            display: none;
        }

        .status-message.error {
            background: #ffebee;
            color: #c62828;
            border-left: 4px solid #c62828;
            display: block;
        }

        .status-message.success {
            background: #e8f5e9;
            color: #2e7d32;
            border-left: 4px solid #2e7d32;
            display: block;
        }

        .status-message.info {
            background: #e3f2fd;
            color: #1565c0;
            border-left: 4px solid #1565c0;
            display: block;
        }

        /* Responsive */
        @media (max-width: 1024px) {
            .container {
                flex-direction: column;
            }

            .settings-panel {
                width: 100%;
                position: static;
            }

            .message-content {
                max-width: 90%;
            }
        }

        @media (max-width: 768px) {
            header h1 {
                font-size: 1.8em;
            }

            .container {
                padding: 0 10px;
            }

            .chat-container {
                border-radius: 10px;
            }

            .message-content {
                max-width: 95%;
            }
        }

        /* Scrollbar Styling */
        .messages::-webkit-scrollbar {
            width: 8px;
        }

        .messages::-webkit-scrollbar-track {
            background: #f0f0f0;
            border-radius: 10px;
        }

        .messages::-webkit-scrollbar-thumb {
            background: #ccc;
            border-radius: 10px;
        }

        .messages::-webkit-scrollbar-thumb:hover {
            background: #999;
        }
    </style>
</head>
<body>
    <!-- Header -->
    <header>
        <h1>🚀 Project Classifier AI Mentor</h1>
        <p>Transform Your Project Ideas into Comprehensive Execution Plans</p>
    </header>

    <!-- Main Container -->
    <div class="container">
        <!-- Settings Panel -->
        <div class="settings-panel">
            <h3>⚙️ Configuration</h3>

            <div class="status-message" id="statusMessage"></div>

            <div class="form-group">
                <label for="apiKey">🔑 Gemini API Key</label>
                <input 
                    type="password" 
                    id="apiKey" 
                    placeholder="Enter your Gemini API key"
                    value=""
                >
            </div>

            <div class="form-group">
                <label for="projectName">📝 Project Name</label>
                <input 
                    type="text" 
                    id="projectName" 
                    placeholder="e.g., E-Commerce Platform"
                    value=""
                >
            </div>

            <div class="form-group">
                <label for="projectDescription">📋 Project Description</label>
                <textarea 
                    id="projectDescription" 
                    placeholder="Describe your project briefly..."
                ></textarea>
            </div>

            <div class="btn-group">
                <button class="btn-analyze" onclick="analyzeProject()">
                    ✨ Analyze Project
                </button>
                <button class="btn-clear" onclick="clearChat()">
                    🗑️ Clear
                </button>
            </div>
        </div>

        <!-- Chat Container -->
        <div class="chat-container">
            <!-- Chat Header -->
            <div class="chat-header">
                <h2>💬 AI Analysis Chat</h2>
                <p id="projectTitle">Enter your project details to get started</p>
            </div>

            <!-- Messages -->
            <div class="messages" id="messages">
                <div class="empty-state">
                    <div class="empty-state-icon">🤖</div>
                    <h3>Welcome to Project Classifier!</h3>
                    <p>Enter your API key and project details, then click "Analyze Project" to get started.</p>
                </div>
            </div>

            <!-- Input Area -->
            <div class="input-area">
                <div class="input-group">
                    <input 
                        type="text" 
                        id="userInput" 
                        placeholder="Ask follow-up questions about your project..."
                        onkeypress="handleKeyPress(event)"
                    >
                    <button onclick="sendFollowUp()">Send</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        const API_KEY_STORAGE_KEY = 'gemini_api_key';
        let currentProjectName = '';
        let currentProjectDescription = '';
        let isLoading = false;

        // Initialize
        document.addEventListener('DOMContentLoaded', function() {
            loadSavedApiKey();
        });

        // Load saved API key
        function loadSavedApiKey() {
            const savedKey = localStorage.getItem(API_KEY_STORAGE_KEY);
            if (savedKey) {
                document.getElementById('apiKey').value = savedKey;
            }
        }

        // Save API key to localStorage
        function saveApiKey() {
            const apiKey = document.getElementById('apiKey').value.trim();
            if (apiKey) {
                localStorage.setItem(API_KEY_STORAGE_KEY, apiKey);
            }
        }

        // Show status message
        function showStatus(message, type = 'info') {
            const statusEl = document.getElementById('statusMessage');
            statusEl.textContent = message;
            statusEl.className = `status-message ${type}`;
            setTimeout(() => {
                statusEl.className = 'status-message';
            }, 5000);
        }

        // Add message to chat
        function addMessage(content, isUser = false) {
            const messagesContainer = document.getElementById('messages');
            
            // Remove empty state if exists
            if (messagesContainer.innerHTML.includes('empty-state')) {
                messagesContainer.innerHTML = '';
            }

            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${isUser ? 'user' : 'assistant'}`;
            
            const avatar = document.createElement('div');
            avatar.className = 'message-avatar';
            avatar.textContent = isUser ? '👤' : '🤖';

            const contentDiv = document.createElement('div');
            contentDiv.className = 'message-content';
            
            // Format content with markdown-like rendering
            contentDiv.innerHTML = formatContent(content);

            messageDiv.appendChild(avatar);
            messageDiv.appendChild(contentDiv);
            messagesContainer.appendChild(messageDiv);

            // Auto scroll to bottom
            messagesContainer.scrollTop = messagesContainer.scrollHeight;
        }

        // Format content for display
        function formatContent(content) {
            let formatted = content;
            
            // Handle code blocks
            formatted = formatted.replace(/```(\w+)?\n([\s\S]*?)\n```/g, 
                '<pre><code>$2</code></pre>');
            
            // Handle inline code
            formatted = formatted.replace(/`([^`]+)`/g, '<code>$1</code>');
            
            // Handle bold
            formatted = formatted.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
            
            // Handle italics
            formatted = formatted.replace(/\*(.+?)\*/g, '<em>$1</em>');
            
            // Handle line breaks
            formatted = formatted.replace(/\n/g, '<br>');
            
            return formatted;
        }

        // Show loading indicator
        function showLoading() {
            addMessage('<div class="loading"><div class="loading-dot"></div><div class="loading-dot"></div><div class="loading-dot"></div></div>', false);
            isLoading = true;
        }

        // Remove loading indicator
        function removeLoading() {
            const messagesContainer = document.getElementById('messages');
            const loadingMessage = messagesContainer.querySelector('.message.assistant:last-child');
            if (loadingMessage && loadingMessage.querySelector('.loading')) {
                loadingMessage.remove();
            }
            isLoading = false;
        }

        // Analyze project
        async function analyzeProject() {
            const apiKey = document.getElementById('apiKey').value.trim();
            const projectName = document.getElementById('projectName').value.trim();
            const projectDescription = document.getElementById('projectDescription').value.trim();

            // Validation
            if (!apiKey) {
                showStatus('❌ Please enter your Gemini API key', 'error');
                return;
            }

            if (!projectName) {
                showStatus('❌ Please enter a project name', 'error');
                return;
            }

            // Save API key
            saveApiKey();

            // Store project info
            currentProjectName = projectName;
            currentProjectDescription = projectDescription;

            // Update chat title
            document.getElementById('projectTitle').textContent = `Analyzing: ${projectName}`;

            // Add user message
            addMessage(`Project: ${projectName}\n${projectDescription ? `Description: ${projectDescription}` : 'No description provided'}`, true);

            // Show loading
            showLoading();

            try {
                // Call backend API
                const response = await fetch('/api/classify', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        api_key: apiKey,
                        project_name: projectName,
                        project_description: projectDescription
                    })
                });

                removeLoading();

                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }

                const data = await response.json();

                if (data.status === 'error') {
                    showStatus(`❌ ${data.error || 'Failed to analyze project'}`, 'error');
                    addMessage(`❌ Error: ${data.error}`, false);
                } else {
                    showStatus('✅ Project analyzed successfully!', 'success');
                    addMessage(data.classification, false);
                }
            } catch (error) {
                removeLoading();
                showStatus(`❌ ${error.message}`, 'error');
                addMessage(`❌ Error: ${error.message}`, false);
            }
        }

        // Send follow-up question
        async function sendFollowUp() {
            const userInput = document.getElementById('userInput').value.trim();

            if (!userInput) {
                showStatus('⚠️ Please enter a message', 'info');
                return;
            }

            if (!currentProjectName) {
                showStatus('❌ Please analyze a project first', 'error');
                return;
            }

            const apiKey = document.getElementById('apiKey').value.trim();
            if (!apiKey) {
                showStatus('❌ Please enter your API key', 'error');
                return;
            }

            // Add user message
            addMessage(userInput, true);
            document.getElementById('userInput').value = '';

            // Show loading
            showLoading();

            try {
                const response = await fetch('/api/follow-up', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        api_key: apiKey,
                        project_name: currentProjectName,
                        project_description: currentProjectDescription,
                        question: userInput
                    })
                });

                removeLoading();

                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }

                const data = await response.json();

                if (data.status === 'error') {
                    addMessage(`❌ Error: ${data.error}`, false);
                } else {
                    addMessage(data.response, false);
                }
            } catch (error) {
                removeLoading();
                addMessage(`❌ Error: ${error.message}`, false);
            }
        }

        // Handle Enter key in input
        function handleKeyPress(event) {
            if (event.key === 'Enter' && !event.shiftKey) {
                event.preventDefault();
                sendFollowUp();
            }
        }

        // Clear chat
        function clearChat() {
            document.getElementById('messages').innerHTML = `
                <div class="empty-state">
                    <div class="empty-state-icon">🤖</div>
                    <h3>Chat Cleared</h3>
                    <p>Enter your project details to get started.</p>
                </div>
            `;
            document.getElementById('projectTitle').textContent = 'Enter your project details to get started';
            document.getElementById('userInput').value = '';
            currentProjectName = '';
            currentProjectDescription = '';
        }
    </script>
</body>
</html>
